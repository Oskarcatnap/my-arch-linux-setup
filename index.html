<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>my-arch-linux-setup site</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: monospace;
            margin: 20px;
        }
        h1 {
            color: #89b4fa;
            border-bottom: 2px dashed #f38ba8;
            padding-bottom: 10px;
        }
        .home-btn {
            display: inline-block;
            background-color: #a6e3a1;
            color: #11111b;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 2px solid #94e2d5;
        }
        .home-btn:hover {
            background-color: #94e2d5;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .photo-card {
            background-color: #313244;
            border: 2px solid #585b70;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        img {
            max-width: 400px;
            height: auto;
            border: 1px solid #fab387;
        }
        p {
            color: #f9e2af;
        }
    </style>
</head>
<body>

    <!-- Кнопка домой на гитхаб репозиторий -->
    <a href="https://github.com/Oskarcatnap/my-arch-linux-setup" class="home-btn">🏠 Home (GitHub Repo)</a>

    <h1>My pc with arch gallery</h1>
    <p>Hi this website has imagges of arch on my Fujitsu Lifebook A512. thx for coming!</p>

    <div class="gallery">
        <div class="photo-card">
            <img src="images/photo1.png" alt="photo1">
            <p>photo1.png</p>
        </div>
        
        <div class="photo-card">
            <img src="images/photo2.png" alt="photo2">
            <p>photo2.png</p>
        </div>
        
        <div class="photo-card">
            <img src="images/photo3.png" alt="photo3">
            <p>photo3.png</p>
        </div>
    </div>

    <footer>
        <p style="margin-top: 40px; color: #6c7086; font-size: 12px;">© 2026 Oskarcatnap. Powered by pure enthusiasm and arch linux.</p>
    </footer>

</body>
</html>
